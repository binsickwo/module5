[pytest]
addopts = --alluredir=./allure-results
log_cli = true
log_cli_level = INFO
log_format = %(message)s
markers =
    smoke: быстрые тесты
    regression: регрессионные тесты
    slow: медленные тесты
    api: API-тесты
    positive: позитивные тесты
    negative: негативные тесты
    auth: тесты авторизации
    validation: тесты валидации
    filtering: тесты фильтрации
    pagination: тесты пагинации
    db: тесты базы данных
    critical: критические тесты
    edge_case: граничные тесты
    
